<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识点视频编辑器</title><style>/* EDITOR_CSS */</style></head><body>
<header><h1 id="projectTitle">知识点视频编辑器</h1><p>白底画面预览 · 旁白字幕独立交付</p></header>
<main><section><canvas id="stage" width="1280" height="720"></canvas><nav><button id="play">播放全片</button><button id="playScene">预览当前镜头</button><button id="stop">暂停</button><span id="time"></span></nav><input id="timeline" type="range" min="0" max="1" value="0" step="0.01"><p id="status" role="status"></p><div id="scenes"></div><nav><button id="addScene">添加分镜</button><button id="removeScene">删除分镜</button><button id="up">分镜前移</button><button id="down">分镜后移</button></nav></section>
<aside><h2>当前分镜</h2><label>分镜名称<input id="sceneTitle"></label><label>旁白<textarea id="narration" rows="5"></textarea></label><label>本镜讲课表达（慢讲概念、轻快举例、重点等）<textarea id="direction" rows="2"></textarea></label><p id="audioState"></p><p id="timingState"></p><audio id="voicePreview" controls></audio><nav><button id="generate">重新生成当前镜配音</button><label class="file">导入配音<input id="audioFile" type="file" accept="audio/*"></label></nav>
<div class="grid"><label>开口等待/秒<input id="leadIn" type="number" min="0" max="1" step="0.01"></label><label>镜末停顿/秒<input id="gapAfter" type="number" min="0" max="1" step="0.01"></label><label>分镜时长/秒<input id="duration" type="number" min="0.1" step="0.1"></label></div>
<label>当前镜字幕计时 cues（可选JSON）<textarea id="cues" rows="2" placeholder='[{"start":0,"end":2,"text":"字幕"}]'></textarea></label><button id="applyCues">应用字幕计时</button><button id="alignVoice">校准配音、字幕与动画（本地）</button><details><summary>教学节拍与语音锚点</summary><p>speech 填本镜旁白原样片段；layerIds 对应画面对象。改文稿后核对它们，再校准。</p><textarea id="beats" rows="6"></textarea><button id="applyBeats">应用教学节拍</button></details>
<h2>画面图层</h2><select id="layer"></select><nav><button id="addText">添加文字</button><button id="addShape">添加物件</button><button id="removeLayer">删除图层</button></nav><label>画面文字<textarea id="layerText" rows="2"></textarea></label><div class="grid"><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>宽<input id="width" type="number" min="1"></label><label>高<input id="height" type="number" min="1"></label><label>缩放<input id="scale" type="number" min="0.01" step="0.05"></label><label>显示<input id="visible" type="checkbox"></label></div>
<nav><label class="file">添加或替换图片<input id="imageFile" type="file" accept="image/*"></label><label class="file">导入短片（本地服务）<input id="videoFile" type="file" accept="video/*"></label></nav><label>动画关键帧JSON<textarea id="keyframes" rows="3"></textarea></label><button id="applyKeyframes">应用关键帧</button>
<h2>工程与导出</h2><nav><button id="saveProject">保存工程JSON</button><label class="file">加载工程JSON<input id="loadProject" type="file" accept=".json"></label><button id="saveHTML">保存当前HTML</button><button id="saveSVG">保存当前画面SVG</button><button id="saveLocal">保存到交付目录</button><button id="export">导出有声MP4及剪映素材</button><button id="webm">离线录制有声WebM</button></nav><label>本地服务地址（启动器自动配置）<input id="serviceUrl" placeholder="由启动入口提供"></label><label>服务会话令牌<input id="serviceToken" type="password"></label><p>播放、编辑、图片和配音导入、保存HTML/JSON可离线。生成配音、短片预处理、保存到目录和MP4导出需要本地服务；模型与浏览器须提前准备。WebM需要浏览器支持MediaRecorder，按实际时长录制；MP4优先使用本地导出。</p></aside></main>
<script id="project-data" type="application/json">/* PROJECT_JSON */</script><script>/* RENDERER_JS */</script><script>/* EDITOR_JS */</script></body></html>
